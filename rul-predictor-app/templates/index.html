<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Turbofan Engine RUL Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>🛩️ Turbofan Engine — RUL Predictor</h1>
            <p class="subtitle">NASA CMAPSS Predictive Maintenance Dashboard</p>
        </header>

        <div class="control-panel">
            <label for="engineSelect">Select Engine:</label>
            <select id="engineSelect">
                <option value="">-- Choose an engine --</option>
                {% for eid in engine_ids %}
                    <option value="{{ eid }}">Engine {{ eid }}</option>
                {% endfor %}
            </select>
        </div>

        <div id="resultArea" class="result-area hidden">

            <div class="cards-row">
                <div class="card">
                    <span class="card-label">Current Cycle</span>
                    <span id="currentCycle" class="card-value">--</span>
                </div>
                <div class="card">
                    <span class="card-label">Predicted RUL</span>
                    <span id="predictedRul" class="card-value">--</span>
                </div>
                <div id="statusCard" class="card status-card">
                    <span class="card-label">Status</span>
                    <span id="statusMessage" class="card-value">--</span>
                </div>
            </div>

            <div class="chart-container">
                <h2>Sensor Trends Over Time</h2>
                <canvas id="sensorChart"></canvas>
            </div>

        </div>

        <div id="loadingMsg" class="hidden">Loading prediction...</div>
        <div id="errorMsg" class="hidden">Something went wrong. Try another engine.</div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
